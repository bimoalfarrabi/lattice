[package]
name = "lattice-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lattice-core.workspace = true
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }

# The test context lives behind this feature. Keeping it out of [dependencies]
# means the shipped binary does not carry test scaffolding, which matters: with
# the feature on, a font that fails to resolve panics instead of falling back.
[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest", "test-support"] }

# Embeds the icon and a version resource into the Windows executable. Only used
# when the build host is Windows, which is where release builds happen.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

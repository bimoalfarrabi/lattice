name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig1-dev \
            libfreetype-dev

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  build:
    name: Package ${{ matrix.artifact }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            artifact: installers-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            artifact: installers-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            artifact: installers-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            artifact: installers-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig1-dev \
            libfreetype-dev

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "building Lattice $version for ${{ matrix.target }}"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match Cargo version $version"
              exit 1
            fi
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p lattice-app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-packages.sh \
            "target/${{ matrix.target }}/release/lattice-app" \
            "${{ steps.version.outputs.value }}" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files (x86)\NSIS"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          makensis `
            "/DVERSION=${{ steps.version.outputs.value }}" `
            "/DBINARY=target\${{ matrix.target }}\release\lattice-app.exe" `
            "/DOUT=dist\lattice-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}-setup.exe" `
            packaging\windows\lattice.nsi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build-dmg.sh \
            "target/${{ matrix.target }}/release/lattice-app" \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.arch }}" dist

      - name: List packages
        shell: bash
        run: ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
